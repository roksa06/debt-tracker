<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debt Tracker - ROKSA</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&display=swap');

    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    body {
      font-family: 'Baloo 2', cursive;
      background: #000000;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-weight: 500;
    }
    .container {
      max-width: 1200px;
      margin: auto;
      background: #111111;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.05);
      color: #ffffff;
    }
    h1 {
      margin-top: 0;
      color: #ffffff;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .header-buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .input-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }
    input, button {
      padding: 10px 14px;
      border: 1px solid #444;
      border-radius: 8px;
      font-size: 15px;
      background-color: #222;
      color: #fff;
      transition: all 0.2s ease;
      font-family: 'Baloo 2', cursive;
      font-weight: 500;
    }
    input::placeholder {
      color: #aaa;
      font-weight: 400;
    }
    input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }
    button {
      cursor: pointer;
      font-weight: 600;
      border: none;
    }
    #addBtn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-weight: 700;
    }
    #addBtn:hover {
      background: linear-gradient(135deg, #1e40af, #1e3a8a);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(37, 99, 235, 0.3);
    }
    #completedBtn {
      background: linear-gradient(135deg, #6b7280, #4b5563);
      color: white;
      font-weight: 700;
    }
    #completedBtn:hover {
      background: linear-gradient(135deg, #4b5563, #374151);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(107, 114, 128, 0.3);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      color: #fff;
    }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #333;
      text-align: left;
    }
    th {
      background: #1a1a1a;
      color: #ccc;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .action-btn, .edit-btn, .complete-btn, .delete-btn {
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
      margin-right: 6px;
      margin-bottom: 4px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }
    .action-btn {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    .action-btn:hover {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(59, 130, 246, 0.3);
    }
    .edit-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }
    .edit-btn:hover {
      background: linear-gradient(135deg, #d97706, #b45309);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(245, 158, 11, 0.3);
    }
    .complete-btn {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    .complete-btn:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(16, 185, 129, 0.3);
    }
    .delete-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
    }
    .delete-btn:hover {
      background: linear-gradient(135deg, #dc2626, #b91c1c);
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(239, 68, 68, 0.3);
    }
    .summary {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
      padding: 16px;
      background: #1a1a1a;
      border-radius: 10px;
      color: #fff;
      font-weight: 500;
    }
    .summary div {
      font-size: 15px;
    }
    .summary span {
      font-weight: 700;
      color: #fff;
    }
    .empty {
      text-align: center;
      color: #aaa;
      padding: 20px;
      font-weight: 400;
    }
    /* Progress bar styles */
    .progress-container {
      width: 120px;
      height: 18px;
      background: #222;
      border-radius: 10px;
      overflow: hidden;
      position: relative;
      border: 1px solid #444;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #4ade80, #22c55e);
      border-radius: 10px;
      transition: width 0.4s ease;
    }
    .progress-text {
      font-size: 13px;
      margin-left: 8px;
      color: #ccc;
      white-space: nowrap;
      font-weight: 500;
    }
    .progress-cell {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    /* Pulse animation for progress bar after payment */
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
      50% { box-shadow: 0 0 0 8px rgba(74, 222, 128, 0); }
      100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
    }
    .progress-bar.pulse {
      animation: pulse 0.8s ease-out;
    }
    /* Modals */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1e1e1e;
      color: #fff;
      padding: 24px;
      border-radius: 12px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .modal-content h2 {
      margin-top: 0;
      font-weight: 700;
    }
    .modal-content input {
      width: 100%;
      margin-bottom: 12px;
    }
    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 16px;
    }
    .modal-buttons button {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    #savePayment, #saveEdit, #confirmComplete, #confirmDelete {
      background: #2563eb;
      color: white;
    }
    #savePayment:hover, #saveEdit:hover, #confirmComplete:hover, #confirmDelete:hover {
      background: #1d4ed8;
    }
    #confirmComplete {
      background: #10b981;
    }
    #confirmComplete:hover {
      background: #059669;
    }
    #confirmDelete {
      background: #ef4444;
    }
    #confirmDelete:hover {
      background: #dc2626;
    }
    #cancelPayment, #cancelEdit, #cancelComplete, #cancelDelete, #closeCompleted {
      background: #444;
      color: white;
    }
    #cancelPayment:hover, #cancelEdit:hover, #cancelComplete:hover, #cancelDelete:hover, #closeCompleted:hover {
      background: #555;
    }
    /* Live preview in modal */
    .preview-progress {
      margin: 12px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .preview-progress .progress-container {
      flex: 1;
    }
    .preview-label {
      font-size: 13px;
      color: #aaa;
      font-weight: 400;
    }
    /* Completed debts table */
    .completed-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      color: #fff;
    }
    .completed-table th,
    .completed-table td {
      padding: 8px;
      border-bottom: 1px solid #333;
      text-align: left;
    }
    .completed-table th {
      background: #1a1a1a;
      color: #ccc;
      font-size: 12px;
      text-transform: uppercase;
    }
    .completed-summary {
      margin-top: 16px;
      padding: 12px;
      background: #1a1a1a;
      border-radius: 8px;
      font-weight: 600;
    }
    /* Fireworks canvas */
    #fireworksCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      display: none;
    }
    /* Watermark */
    .watermark {
      text-align: center;
      color: #555;
      font-size: 14px;
      margin-top: 20px;
      opacity: 0.6;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Debt Tracker</h1>

    <div class="header-buttons">
      <button id="completedBtn">Completed Debts</button>
    </div>

    <div class="input-row">
      <input type="text" id="name" placeholder="Debt name *">
      <input type="text" id="creditor" placeholder="Creditor">
      <input type="number" id="balance" placeholder="Balance *" step="0.01" min="0">
      <input type="number" id="interest" placeholder="Interest rate %" step="0.01" min="0">
      <input type="number" id="minPayment" placeholder="Minimum payment" step="0.01" min="0">
      <input type="date" id="dueDate">
      <button id="addBtn">+ Add Debt</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Debt Name</th>
          <th>Creditor</th>
          <th>Balance</th>
          <th>Progress</th>
          <th>Interest %</th>
          <th>Min Payment</th>
          <th>Due Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="debtList"></tbody>
    </table>
    <div id="emptyMessage" class="empty">No debts added yet. Add your first debt above.</div>

    <div class="summary">
      <div>Total Balance: <span id="totalBalance">$0.00</span></div>
      <div>Total Min Payments: <span id="totalMin">$0.00</span></div>
      <div>Avg Interest Rate: <span id="avgInterest">0.00%</span></div>
    </div>
  </div>

  <!-- Watermark -->
  <div class="watermark">ROKSA</div>

  <!-- Make Payment Modal -->
  <div id="paymentModal" class="modal">
    <div class="modal-content">
      <h2>Make a Payment</h2>
      <p id="paymentDebtName" style="margin-bottom:8px;"></p>
      <input type="number" id="paymentInput" step="0.01" min="0" placeholder="Payment amount">
      <div class="preview-progress">
        <div class="progress-container">
          <div class="progress-bar" id="previewProgressBar" style="width: 1%;"></div>
        </div>
        <span class="preview-label" id="previewProgressText">1%</span>
      </div>
      <div class="modal-buttons">
        <button id="cancelPayment">Cancel</button>
        <button id="savePayment">Apply Payment</button>
      </div>
    </div>
  </div>

  <!-- Edit Debt Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit Debt</h2>
      <input type="text" id="editName" placeholder="Debt name *">
      <input type="text" id="editCreditor" placeholder="Creditor">
      <input type="number" id="editBalance" placeholder="Balance *" step="0.01" min="0">
      <input type="number" id="editInterest" placeholder="Interest rate %" step="0.01" min="0">
      <input type="number" id="editMinPayment" placeholder="Minimum payment" step="0.01" min="0">
      <input type="date" id="editDueDate">
      <div class="modal-buttons">
        <button id="cancelEdit">Cancel</button>
        <button id="saveEdit">Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Complete Debt Modal -->
  <div id="completeModal" class="modal">
    <div class="modal-content">
      <h2>Complete Debt</h2>
      <p id="completeDebtName" style="margin-bottom:16px;"></p>
      <div class="modal-buttons">
        <button id="cancelComplete">Cancel</button>
        <button id="confirmComplete">Mark as Completed</button>
      </div>
    </div>
  </div>

  <!-- Permanent Delete Modal -->
  <div id="deleteModal" class="modal">
    <div class="modal-content">
      <h2>Delete Debt</h2>
      <p id="deleteDebtName" style="margin-bottom:16px;"></p>
      <div class="modal-buttons">
        <button id="cancelDelete">Cancel</button>
        <button id="confirmDelete">Delete Permanently</button>
      </div>
    </div>
  </div>

  <!-- Completed Debts Modal -->
  <div id="completedModal" class="modal">
    <div class="modal-content">
      <h2>Completed Debts</h2>
      <div id="completedListContainer">
        <!-- Completed debts will be rendered here -->
      </div>
      <div class="modal-buttons" style="margin-top: 16px;">
        <button id="closeCompleted">Close</button>
      </div>
    </div>
  </div>

  <!-- Fireworks Canvas -->
  <canvas id="fireworksCanvas"></canvas>

  <script>
    // DOM elements
    const addBtn = document.getElementById('addBtn');
    const debtList = document.getElementById('debtList');
    const emptyMessage = document.getElementById('emptyMessage');
    const totalBalanceEl = document.getElementById('totalBalance');
    const totalMinEl = document.getElementById('totalMin');
    const avgInterestEl = document.getElementById('avgInterest');
    const completedBtn = document.getElementById('completedBtn');

    // Payment modal
    const paymentModal = document.getElementById('paymentModal');
    const paymentInput = document.getElementById('paymentInput');
    const paymentDebtName = document.getElementById('paymentDebtName');
    const savePaymentBtn = document.getElementById('savePayment');
    const cancelPaymentBtn = document.getElementById('cancelPayment');
    const previewProgressBar = document.getElementById('previewProgressBar');
    const previewProgressText = document.getElementById('previewProgressText');

    // Edit modal
    const editModal = document.getElementById('editModal');
    const editName = document.getElementById('editName');
    const editCreditor = document.getElementById('editCreditor');
    const editBalance = document.getElementById('editBalance');
    const editInterest = document.getElementById('editInterest');
    const editMinPayment = document.getElementById('editMinPayment');
    const editDueDate = document.getElementById('editDueDate');
    const saveEditBtn = document.getElementById('saveEdit');
    const cancelEditBtn = document.getElementById('cancelEdit');

    // Complete modal
    const completeModal = document.getElementById('completeModal');
    const completeDebtName = document.getElementById('completeDebtName');
    const confirmCompleteBtn = document.getElementById('confirmComplete');
    const cancelCompleteBtn = document.getElementById('cancelComplete');

    // Permanent delete modal
    const deleteModal = document.getElementById('deleteModal');
    const deleteDebtName = document.getElementById('deleteDebtName');
    const confirmDeleteBtn = document.getElementById('confirmDelete');
    const cancelDeleteBtn = document.getElementById('cancelDelete');

    // Completed modal
    const completedModal = document.getElementById('completedModal');
    const completedListContainer = document.getElementById('completedListContainer');
    const closeCompletedBtn = document.getElementById('closeCompleted');

    // Fireworks
    const fireworksCanvas = document.getElementById('fireworksCanvas');
    const ctx = fireworksCanvas.getContext('2d');
    let particles = [];
    let animationFrame = null;
    let fireworksActive = false;
    let fireworksStartTime = 0;
    const FIREWORKS_DURATION = 3000;
    const BURST_COUNT = 10;
    const PARTICLE_COUNT = 100;

    // Storage keys
    const STORAGE_KEY = 'debtTrackerDebts';
    const COMPLETED_STORAGE_KEY = 'debtTrackerCompletedDebts';

    // State
    let debts = loadDebts();
    let completedDebts = loadCompletedDebts();
    let currentEditIndex = null;
    let currentPaymentIndex = null;
    let currentCompleteIndex = null;
    let currentDeleteIndex = null;

    // Helper functions
    function loadDebts() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          const parsed = JSON.parse(stored);
          return parsed.map(debt => {
            if (!debt.initialBalance) debt.initialBalance = debt.balance;
            return debt;
          });
        }
        return [];
      } catch (err) {
        console.error('Error loading debts:', err);
        return [];
      }
    }

    function loadCompletedDebts() {
      try {
        const stored = localStorage.getItem(COMPLETED_STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (err) {
        console.error('Error loading completed debts:', err);
        return [];
      }
    }

    function saveDebts(debts) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(debts));
      } catch (err) {
        alert('Could not save debt. Error: ' + err.message);
      }
    }

    function saveCompletedDebts(completedDebts) {
      try {
        localStorage.setItem(COMPLETED_STORAGE_KEY, JSON.stringify(completedDebts));
      } catch (err) {
        alert('Could not save completed debts. Error: ' + err.message);
      }
    }

    function formatCurrency(value) {
      return value.toLocaleString('en-US', { style: 'currency', currency: 'USD' });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function calculateProgress(debt) {
      const initial = parseFloat(debt.initialBalance) || 0;
      const current = parseFloat(debt.balance) || 0;
      if (initial <= 0) return 1;
      const paid = initial - current;
      let percent = (paid / initial) * 100;
      percent = Math.max(1, Math.min(100, percent));
      return percent;
    }

    // Render active debts
    function render() {
      debtList.innerHTML = '';
      emptyMessage.style.display = debts.length === 0 ? 'block' : 'none';

      let totalBalance = 0;
      let totalMin = 0;
      let weightedInterestSum = 0;

      debts.forEach((debt, index) => {
        const balance = parseFloat(debt.balance) || 0;
        const interest = parseFloat(debt.interest) || 0;
        const minPayment = parseFloat(debt.minPayment) || 0;

        totalBalance += balance;
        totalMin += minPayment;
        weightedInterestSum += balance * interest;

        const progress = calculateProgress(debt);

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${escapeHtml(debt.name)}</td>
          <td>${escapeHtml(debt.creditor || '—')}</td>
          <td>${formatCurrency(balance)}</td>
          <td>
            <div class="progress-cell">
              <div class="progress-container">
                <div class="progress-bar" style="width: ${progress}%;"></div>
              </div>
              <span class="progress-text">${progress.toFixed(0)}%</span>
            </div>
          </td>
          <td>${interest.toFixed(2)}%</td>
          <td>${formatCurrency(minPayment)}</td>
          <td>${debt.dueDate || '—'}</td>
          <td>
            <button class="action-btn" data-index="${index}">Make Payment</button>
            <button class="edit-btn" data-index="${index}">Edit</button>
            <button class="complete-btn" data-index="${index}">Complete</button>
            <button class="delete-btn" data-index="${index}">Delete</button>
          </td>
        `;
        debtList.appendChild(row);
      });

      totalBalanceEl.textContent = formatCurrency(totalBalance);
      totalMinEl.textContent = formatCurrency(totalMin);
      const avgInterest = totalBalance > 0 ? (weightedInterestSum / totalBalance) : 0;
      avgInterestEl.textContent = avgInterest.toFixed(2) + '%';
    }

    // Render completed debts in modal
    function renderCompletedDebts() {
      completedListContainer.innerHTML = '';
      if (completedDebts.length === 0) {
        completedListContainer.innerHTML = '<p class="empty">No completed debts yet.</p>';
        return;
      }

      let totalPaid = 0;

      const table = document.createElement('table');
      table.className = 'completed-table';
      table.innerHTML = `
        <thead>
          <tr>
            <th>Debt Name</th>
            <th>Creditor</th>
            <th>Original Balance</th>
            <th>Amount Paid</th>
            <th>Completed On</th>
          </tr>
        </thead>
        <tbody>
          ${completedDebts.map(debt => {
            const initial = parseFloat(debt.initialBalance) || 0;
            const remaining = parseFloat(debt.balance) || 0;
            const amountPaid = Math.max(0, initial - remaining);
            totalPaid += amountPaid;
            return `
              <tr>
                <td>${escapeHtml(debt.name)}</td>
                <td>${escapeHtml(debt.creditor || '—')}</td>
                <td>${formatCurrency(initial)}</td>
                <td>${formatCurrency(amountPaid)}</td>
                <td>${debt.completedAt ? new Date(debt.completedAt).toLocaleDateString() : '—'}</td>
              </tr>
            `;
          }).join('')}
        </tbody>
      `;
      completedListContainer.appendChild(table);

      const summaryDiv = document.createElement('div');
      summaryDiv.className = 'completed-summary';
      summaryDiv.innerHTML = `Total Debts Completed: <strong>${completedDebts.length}</strong> &nbsp;|&nbsp; Total Amount Paid: <strong>${formatCurrency(totalPaid)}</strong>`;
      completedListContainer.appendChild(summaryDiv);
    }

    // Event delegation for active table buttons
    debtList.addEventListener('click', (e) => {
      const target = e.target;
      const index = parseInt(target.dataset.index, 10);

      if (target.classList.contains('action-btn')) {
        currentPaymentIndex = index;
        openPaymentModal(index);
      }
      if (target.classList.contains('edit-btn')) {
        currentEditIndex = index;
        openEditModal(index);
      }
      if (target.classList.contains('complete-btn')) {
        currentCompleteIndex = index;
        openCompleteModal(index);
      }
      if (target.classList.contains('delete-btn')) {
        currentDeleteIndex = index;
        openDeleteModal(index);
      }
    });

    // ---------- Payment Modal ----------
    function openPaymentModal(index) {
      const debt = debts[index];
      paymentDebtName.textContent = `Debt: ${debt.name} — Current balance: ${formatCurrency(parseFloat(debt.balance) || 0)}`;
      paymentInput.value = '';
      updatePreviewProgress(0);
      paymentModal.style.display = 'flex';
      paymentInput.focus();
    }

    function closePaymentModal() {
      paymentModal.style.display = 'none';
      currentPaymentIndex = null;
    }

    function updatePreviewProgress(paymentAmount) {
      if (currentPaymentIndex === null) return;
      const debt = debts[currentPaymentIndex];
      const initial = parseFloat(debt.initialBalance) || 0;
      const current = parseFloat(debt.balance) || 0;
      const newBalance = Math.max(0, current - paymentAmount);
      const paid = initial - newBalance;
      let percent = initial > 0 ? (paid / initial) * 100 : 0;
      percent = Math.max(1, Math.min(100, percent));
      previewProgressBar.style.width = percent + '%';
      previewProgressText.textContent = percent.toFixed(0) + '%';
    }

    paymentInput.addEventListener('input', (e) => {
      const amount = parseFloat(e.target.value) || 0;
      updatePreviewProgress(amount);
    });

    savePaymentBtn.addEventListener('click', () => {
      if (currentPaymentIndex === null) return;
      const paymentAmount = parseFloat(paymentInput.value);
      if (isNaN(paymentAmount) || paymentAmount <= 0) {
        alert('Please enter a valid payment amount (greater than 0).');
        return;
      }

      const currentBalance = parseFloat(debts[currentPaymentIndex].balance) || 0;
      let newBalance = currentBalance - paymentAmount;

      if (newBalance < 0) {
        newBalance = 0;
        alert(`This payment exceeds the remaining balance. Balance set to $0.00.`);
      }

      debts[currentPaymentIndex].balance = newBalance;
      saveDebts(debts);
      render();

      const progressBar = document.querySelectorAll('.progress-bar')[currentPaymentIndex];
      if (progressBar) {
        progressBar.classList.add('pulse');
        setTimeout(() => {
          progressBar.classList.remove('pulse');
        }, 800);
      }

      closePaymentModal();
    });

    cancelPaymentBtn.addEventListener('click', closePaymentModal);

    // ---------- Edit Modal ----------
    function openEditModal(index) {
      const debt = debts[index];
      editName.value = debt.name;
      editCreditor.value = debt.creditor || '';
      editBalance.value = debt.balance;
      editInterest.value = debt.interest;
      editMinPayment.value = debt.minPayment;
      editDueDate.value = debt.dueDate || '';
      editModal.style.display = 'flex';
      editName.focus();
    }

    function closeEditModal() {
      editModal.style.display = 'none';
      currentEditIndex = null;
    }

    saveEditBtn.addEventListener('click', () => {
      if (currentEditIndex === null) return;

      const name = editName.value.trim();
      const balance = parseFloat(editBalance.value);
      if (!name) {
        alert('Please enter a Debt Name.');
        return;
      }
      if (isNaN(balance) || balance < 0) {
        alert('Please enter a valid Balance (0 or more).');
        return;
      }

      debts[currentEditIndex].name = name;
      debts[currentEditIndex].creditor = editCreditor.value.trim();
      debts[currentEditIndex].balance = balance;
      debts[currentEditIndex].interest = editInterest.value || '0';
      debts[currentEditIndex].minPayment = editMinPayment.value || '0';
      debts[currentEditIndex].dueDate = editDueDate.value;

      saveDebts(debts);
      render();
      closeEditModal();
    });

    cancelEditBtn.addEventListener('click', closeEditModal);

    // ---------- Complete Modal ----------
    function openCompleteModal(index) {
      const debt = debts[index];
      completeDebtName.textContent = `Mark "${debt.name}" as completed and move to archive?`;
      completeModal.style.display = 'flex';
    }

    function closeCompleteModal() {
      completeModal.style.display = 'none';
      currentCompleteIndex = null;
    }

    confirmCompleteBtn.addEventListener('click', () => {
      if (currentCompleteIndex === null) return;
      const completedDebt = debts[currentCompleteIndex];
      completedDebt.completedAt = new Date().toISOString();
      completedDebts.push(completedDebt);
      debts.splice(currentCompleteIndex, 1);
      saveDebts(debts);
      saveCompletedDebts(completedDebts);
      render();
      closeCompleteModal();
      launchFireworks(FIREWORKS_DURATION, BURST_COUNT, PARTICLE_COUNT);
    });

    cancelCompleteBtn.addEventListener('click', closeCompleteModal);

    // ---------- Permanent Delete Modal ----------
    function openDeleteModal(index) {
      const debt = debts[index];
      deleteDebtName.textContent = `Permanently delete "${debt.name}"? This cannot be undone.`;
      deleteModal.style.display = 'flex';
    }

    function closeDeleteModal() {
      deleteModal.style.display = 'none';
      currentDeleteIndex = null;
    }

    confirmDeleteBtn.addEventListener('click', () => {
      if (currentDeleteIndex === null) return;
      debts.splice(currentDeleteIndex, 1);
      saveDebts(debts);
      render();
      closeDeleteModal();
    });

    cancelDeleteBtn.addEventListener('click', closeDeleteModal);

    // ---------- Completed Modal ----------
    completedBtn.addEventListener('click', () => {
      renderCompletedDebts();
      completedModal.style.display = 'flex';
    });

    closeCompletedBtn.addEventListener('click', () => {
      completedModal.style.display = 'none';
    });

    // Close modals when clicking outside
    window.addEventListener('click', (e) => {
      if (e.target === paymentModal) closePaymentModal();
      if (e.target === editModal) closeEditModal();
      if (e.target === completeModal) closeCompleteModal();
      if (e.target === deleteModal) closeDeleteModal();
      if (e.target === completedModal) completedModal.style.display = 'none';
    });

    // ---------- Fireworks logic (for complete only) ----------
    function resizeFireworksCanvas() {
      fireworksCanvas.width = window.innerWidth;
      fireworksCanvas.height = window.innerHeight;
    }

    function createBurst(x, y, particleCount) {
      const colors = ['#ff4d4d', '#ffa64d', '#ffff4d', '#4dff4d', '#4d4dff', '#ff4dff', '#ffffff', '#ffcc00'];
      for (let i = 0; i < particleCount; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        const vx = Math.cos(angle) * speed;
        const vy = Math.sin(angle) * speed;
        const color = colors[Math.floor(Math.random() * colors.length)];
        particles.push({
          x: x,
          y: y,
          vx: vx,
          vy: vy,
          color: color,
          alpha: 1,
          life: Math.random() * 30 + 20
        });
      }
    }

    function animateFireworks(duration) {
      const now = Date.now();
      if (now - fireworksStartTime > duration) {
        stopFireworks();
        return;
      }

      ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.05;
        p.alpha -= 0.01;
        p.life--;

        if (p.life <= 0 || p.alpha <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      animationFrame = requestAnimationFrame(() => animateFireworks(duration));
    }

    function stopFireworks() {
      fireworksActive = false;
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      particles = [];
      ctx.clearRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);
      fireworksCanvas.style.display = 'none';
    }

    function launchFireworks(duration, burstCount, particleCount) {
      if (fireworksActive) stopFireworks();
      resizeFireworksCanvas();
      fireworksCanvas.style.display = 'block';
      fireworksActive = true;
      fireworksStartTime = Date.now();

      const bursts = [];
      for (let i = 0; i < burstCount; i++) {
        bursts.push({
          x: Math.random() * fireworksCanvas.width,
          y: Math.random() * fireworksCanvas.height * 0.7,
          delay: i * 200
        });
      }

      bursts.forEach(burst => {
        setTimeout(() => {
          if (fireworksActive) createBurst(burst.x, burst.y, particleCount);
        }, burst.delay);
      });

      animateFireworks(duration);
    }

    // ---------- Add Debt ----------
    addBtn.addEventListener('click', () => {
      const name = document.getElementById('name').value.trim();
      const creditor = document.getElementById('creditor').value.trim();
      const balance = document.getElementById('balance').value;
      const interest = document.getElementById('interest').value || '0';
      const minPayment = document.getElementById('minPayment').value || '0';
      const dueDate = document.getElementById('dueDate').value;

      if (!name) {
        alert('Please enter a Debt Name.');
        return;
      }
      if (!balance || parseFloat(balance) <= 0) {
        alert('Please enter a valid Balance (greater than 0).');
        return;
      }

      const initialBalance = parseFloat(balance);
      debts.push({ 
        name, 
        creditor, 
        balance: initialBalance, 
        initialBalance, 
        interest, 
        minPayment, 
        dueDate 
      });
      saveDebts(debts);
      render();

      document.getElementById('name').value = '';
      document.getElementById('creditor').value = '';
      document.getElementById('balance').value = '';
      document.getElementById('interest').value = '';
      document.getElementById('minPayment').value = '';
      document.getElementById('dueDate').value = '';
      document.getElementById('name').focus();
    });

    // Initial render
    render();
  </script>
</body>
</html>
